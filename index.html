<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MONIFY</title><style>
:root{--bg:#f6f7f9;--c:#fff;--t:#161c24;--m:#7a8591;--b:#e8ebef;--g:#4f9d78;--r:#d4585a;--bl:#1d242c;--pu:#8a949f;--sh:0 1px 2px rgba(16,24,40,.04),0 12px 28px -14px rgba(16,24,40,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1319;--c:#171e26;--t:#e9eef3;--m:#8f9ba7;--b:#26303a;--g:#6fcf9f;--r:#ec7f80;--bl:#e9eef3;--pu:#9aa5b0;--sh:0 12px 28px -14px #0009}}
:root[data-theme=dark]{--bg:#0e1319;--c:#171e26;--t:#e9eef3;--m:#8f9ba7;--b:#26303a;--g:#6fcf9f;--r:#ec7f80;--bl:#e9eef3;--pu:#9aa5b0;--sh:0 12px 28px -14px #0009}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

.tabs{display:flex;background:var(--b);border-radius:14px;padding:4px;margin-bottom:18px}.tabs button{all:unset;flex:1;text-align:center;padding:10px 4px;border-radius:11px;color:var(--m);cursor:pointer;font-size:14px;font-weight:600;transition:.25s}.tabs button.on{background:var(--c);color:var(--t);box-shadow:var(--sh)}
.card{background:var(--c);border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:14px;animation:u .35s both}@keyframes u{from{opacity:0;transform:translateY(8px)}}

.bar{height:8px;border-radius:8px;overflow:hidden;margin:12px 0;background:var(--b)}.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
input,select{font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--b);background:var(--bg);color:var(--t);width:100%}input:focus{outline:0;border-color:var(--bl)}
.btn{font:inherit;font-weight:600;font-size:15px;width:100%;padding:13px;border:0;border-radius:14px;color:#fff;cursor:pointer;margin-top:10px;transition:.2s}.btn:hover{opacity:.9}.btn.o{background:var(--bg);color:var(--t)}

</style></head><body><main><header><span class="logo">🌿 Monify</span><span><span class="l" id="sy"></span> <button class="mini" onclick="tut(0)">? Ayuda</button></span></header>
<div class="tabs"><button data-t="i" onclick="go('i')">Inicio</button><button data-t="h" onclick="go('h')">Historial</button><button data-t="c" onclick="go('c')">Configuración</button></div><div id="v"></div></main>
<div id="ov"><div class="card"><b id="mt"></b><p class="l">Nombre</p><input id="gn" placeholder="Ej: Mercado"><p class="l">Valor en pesos</p><input id="gv" type="number" min="1" inputmode="numeric" placeholder="Ej: 50000"><p class="l">Categoría</p><select id="gc"><option value="0">Necesidades</option><option value="1">Gustos y ocio</option><option value="2">Ahorro</option></select><div id="me" class="r l"></div><button class="btn" style="background:var(--g)" onclick="add()">Guardar</button><button class="btn o" onclick="ov.classList.remove('on')">Cancelar</button></div></div>

<div id="fm" class="mo"><div class="card"><b id="ft"></b><p class="l">Nombre</p><input id="fn"><p class="l">Valor en pesos</p><input id="fv" type="number" min="1" inputmode="numeric"><div id="fdw"><p class="l">Día del mes</p><input id="fd" type="number" min="1" max="31" inputmode="numeric"></div><div id="fe" class="r l"></div><button class="btn" style="background:var(--g)" onclick="saveF()">Guardar</button><button class="btn o" onclick="$('#fm').classList.remove('on')">Cancelar</button></div></div>
<div id="tu" class="mo"><div class="card" style="text-align:center"><div class="l" id="tg"></div><svg id="ts" viewBox="0 0 200 120" width="100%" style="max-width:260px;margin:8px 0"></svg><div class="n" id="tl"></div><p id="tdesc" class="l" style="font-size:15px"></p><button class="btn" style="background:var(--g)" id="tbn" onclick="tnext()">Entendido</button><button class="btn o" onclick="tskip()">Saltar</button></div></div>
<script>
const $=s=>document.querySelector(s),ov=$('#ov'),MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],CN=['Necesidades','Gustos y ocio','Ahorro'],COL=['bl','pu','g'],
M=n=>(n<0?'-':'')+'$'+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},CM=()=>td().slice(0,7),lab=k=>MES[+k.slice(5)-1]+' '+k.slice(0,4),
IC=['<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>','<path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>','<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h3.7a1.8 1.8 0 0 1 0 3.5h-2.4a1.8 1.8 0 0 0 0 3.5H15"/>'];
let gid=null,S=null,DB=null,tab='i',cc=0,hm=CM();
const blank=()=>({cfg:{s:0,p:[50,30]},m:{},g:[]});
try{S=JSON.parse(localStorage.getItem('md2'))}catch(e){}
if(!S){S=blank();try{const o=JSON.parse(localStorage.getItem('md'));if(o){S.cfg={s:o.s||0,p:o.p||[50,30]};S.g=(o.g||[]).map(x=>({...x,d:td()}))}}catch(e){}}
const sy=t=>$('#sy').textContent=t;
function save(){try{localStorage.setItem('md2',JSON.stringify(S))}catch(e){}if(DB)DB.set(JSON.parse(JSON.stringify(S))).catch(()=>sy('Solo en este dispositivo'))}
function mo(k){if(!S.m[k]&&k==CM())S.m[k]={s:S.cfg.s,p:[...S.cfg.p]};return S.m[k]||{s:0,p:S.cfg.p}}
function calc(k){const m=mo(k),a=Math.floor(m.s*m.p[0]/100),b=Math.floor(m.s*m.p[1]/100),u=[0,1,2].map(c=>S.g.filter(x=>x.c==c&&x.d.slice(0,7)==k).reduce((s,x)=>s+x.a,0));return{s:m.s,p:m.p,b:[a,b,m.s-a-b],u,gs:u[0]+u[1],q:m.s-u[0]-u[1]-u[2],has:!!S.m[k]}}
function donut(s){s=s.filter(x=>x.v>0);const T=s.reduce((a,x)=>a+x.v,0);if(!T)return'<p class="l">Aún no hay datos.</p>';let o=0;const R=40,L=2*Math.PI*R;
return`<svg viewBox="0 0 100 100" width="150">${s.map(x=>{const d=x.v/T*L,e=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${x.c}" stroke-width="14" stroke-dasharray="${d} ${L-d}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=d;return e}).join('')}</svg><div class="lg">${s.map(x=>`<span><b style="background:${x.c}"></b>${x.l}: ${M(x.v)}</span>`).join('')}</div>`}
const go=t=>{tab=t;render()};
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));({i:vI,h:vH,c:vC})[tab]()}
function entry(x,del){return`<div class="it"><span>${E(x.n)}<small>${x.d}${del?'':' · '+CN[x.c]}</small></span><span><b>${M(x.a)}</b>${del?`<button onclick="rm('${x.id}')">✕</button>`:''}</span></div>`}
function vI(){const k=CM(),r=calc(k);
if(!r.s){$('#v').innerHTML=`<div class="card"><div class="l">${lab(k)}</div><p>Empieza escribiendo tu salario.</p><button class="btn" style="background:var(--bl)" onclick="opS()">+ Ingresos · Digitar salario</button></div>`;return}
$('#v').innerHTML=`<div class="card"><div class="l">Me queda en ${lab(k)}</div><div class="big ${r.q<0?'r':'g'}">${M(r.q)}</div><div class="trio"><div><span class="l">Salario</span><b>${M(r.s)}</b></div><div><span class="l">Gastado</span><b class="r">${M(r.gs)}</b></div><div><span class="l">Ahorrado</span><b class="pu">${M(r.u[2])}</b></div></div><button class="btn" style="background:var(--t);color:var(--c)" onclick="op(0)">+ Agregar gasto</button><button class="btn o" onclick="opS()">+ Ingresos · Digitar salario</button></div>${ex1(r,k)}
<div class="grid">${[0,1,2].map(c=>{const left=r.b[c]-r.u[c],p=r.b[c]?Math.min(100,r.u[c]*100/r.b[c]):0,sv=c==2;
return`<div class="card"><span class="ic" style="background:color-mix(in srgb,var(--${COL[c]}) 14%,transparent);color:var(--${COL[c]})"><svg viewBox="0 0 24 24">${IC[c]}</svg></span><b>${CN[c]}</b> <span class="l">${r.p[c]??100-r.p[0]-r.p[1]}%</span>
<div class="l" style="margin-top:14px">${sv?'Meta de ahorro':'Presupuesto'}</div><div class="n">${M(r.b[c])}</div><div class="bar"><i style="width:${p}%;background:var(--${sv?'pu':'r'})"></i></div>
<div class="l">${sv?'Ahorrado':'Gastado'} <b class="${sv?'pu':'r'}">${M(r.u[c])}</b> · ${sv?'Falta':'Queda'} <b class="${left<0?'r':'g'}">${M(sv?Math.max(0,left):left)}</b></div>${left<0&&!sv?'<div class="l r">Te pasaste del presupuesto</div>':''}
<button class="btn" style="background:var(--${COL[c]})" onclick="op(${c})">${sv?'+ Guardar ahorro':'+ Agregar gasto'}</button>
${S.g.filter(x=>x.c==c&&x.d.slice(0,7)==k).map(x=>entry(x,1)).join('')}</div>`}).join('')}</div>
<div class="card" style="margin-top:14px"><b>¿Dónde está mi dinero?</b><div>${donut([{l:'Necesidades',v:r.u[0],c:'#d4585a'},{l:'Gustos',v:r.u[1],c:'#e2a15b'},{l:'Ahorro',v:r.u[2],c:'#7a5fd1'},{l:'Me queda',v:Math.max(0,r.q),c:'#4f9d78'}])}</div></div><div class="grid" style="margin-top:14px">${ex2()}</div>`}
function vH(){const r=calc(hm),ms=[];let y=+hm.slice(0,4),m=+hm.slice(5);for(let i=5;i>=0;i--){let a=m-i,yy=y;while(a<1){a+=12;yy--}ms.push(yy+'-'+String(a).padStart(2,'0'))}
const vals=ms.map(k=>calc(k).gs),mx=Math.max(1,...vals),sh=v=>v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'k',list=S.g.filter(x=>x.d.slice(0,7)==hm).sort((a,b)=>b.d.localeCompare(a.d));
$('#v').innerHTML=`<div class="card"><div class="l">Revisar mes y año</div><input type="month" id="hm" value="${hm}" max="${CM()}" onchange="if(this.value){hm=this.value;vH()}"></div>
${r.has?`<div class="card"><div class="l">Resumen de ${lab(hm)}</div><div class="grid" style="margin-top:10px"><div><div class="l">Recibí</div><div class="n">${M(r.s)}</div></div><div><div class="l">Gasté</div><div class="n r">${M(r.gs)}</div></div><div><div class="l">Ahorré</div><div class="n pu">${M(r.u[2])}</div></div><div><div class="l">Resto</div><div class="n ${r.q<0?'r':'g'}">${M(r.q)}</div></div></div></div>
<div class="card"><b>Total por categoría</b>${[0,1,2].map(c=>`<div class="it"><span>${CN[c]}</span><b class="${COL[c]=='bl'?'r':COL[c]}">${M(r.u[c])}</b></div>`).join('')}</div>
<div class="card"><b>Movimientos</b>${list.map(x=>entry(x,0)).join('')||'<p class="l">Sin gastos registrados este mes.</p>'}</div>`:`<div class="card"><p class="l">No hay registros en ${lab(hm)}.</p></div>`}
<div class="card"><b>Gastos de los últimos meses</b><svg viewBox="0 0 300 130" width="100%">${ms.map((k,i)=>{const h=vals[i]/mx*80,X=i*50+10;return`<rect x="${X}" y="${100-h}" width="30" height="${Math.max(h,1)}" rx="6" fill="var(--r)" opacity="${k==hm?1:.4}"/><text x="${X+15}" y="${95-h}" font-size="8" text-anchor="middle" fill="var(--m)">${vals[i]?sh(vals[i]):''}</text><text x="${X+15}" y="118" font-size="9" text-anchor="middle" fill="var(--m)">${MES[+k.slice(5)-1].slice(0,3)}</text>`}).join('')}</svg></div>`}
function vC(){const c=S.cfg;$('#v').innerHTML=`<div class="card"><b>Mi salario</b><select id="fq" onchange="setS($('#s').value)" style="margin:10px 0"><option value="m">Me pagan cada mes</option><option value="q" ${c.f=='q'?'selected':''}>Me pagan cada quincena</option></select><p class="l">Cada mes nuevo empieza con este salario. Los meses anteriores no cambian.</p><input id="s" type="number" min="0" step="1000" inputmode="numeric" placeholder="Escribe cuánto ganas" value="${(c.v??c.s)||''}" oninput="setS(this.value)"><div class="l" id="sf" style="margin-top:6px">${c.s?M(c.s):''}</div></div>
<div class="card"><b>Distribución</b><div class="row" style="margin-top:12px"><label class="l">Necesidades %<input id="p0" type="number" min="0" max="100" value="${c.p[0]}" oninput="setP()"></label><label class="l">Gustos %<input id="p1" type="number" min="0" max="100" value="${c.p[1]}" oninput="setP()"></label></div><p>Ahorro: <b class="pu" id="pa">${100-c.p[0]-c.p[1]}%</b></p><div id="pe" class="r l"></div></div>`}
function setS(v,f){f=f||($('#fq')?$('#fq').value:S.cfg.f||'m');v=Math.max(0,Math.round(+v||0));const s=f=='q'?v*2:v;mo(CM());S.cfg={...S.cfg,s,v,f};S.m[CM()].s=s;if($('#sf'))$('#sf').textContent=s?(f=='q'?'Salario mensual: ':'')+M(s):'';save()}
function setP(){const a=Math.round(+$('#p0').value||0),b=Math.round(+$('#p1').value||0);if(a<0||b<0||a+b>100){$('#pe').textContent='Necesidades + Gustos no pueden pasar de 100%.';return}$('#pe').textContent='';$('#pa').textContent=(100-a-b)+'%';mo(CM());S.cfg.p=[a,b];S.m[CM()].p=[a,b];save()}
function opS(){$('#sv').value=(S.cfg.v??S.cfg.s)||'';$('#sq').value=S.cfg.f||'m';$('#se').textContent='';$('#ov2').classList.add('on');$('#sv').focus()}
function saveS(){const v=Math.round(+$('#sv').value);if(!(v>0)){$('#se').textContent='Escribe un salario mayor a 0.';return}setS(v,$('#sq').value);$('#ov2').classList.remove('on');render()}
function op(c,n,g){cc=c;gid=g||null;$('#gc').value=c;$('#mt').textContent=c==2?'Guardar ahorro':'Agregar gasto';$('#gn').value=n||'';$('#gv').value='';$('#me').textContent='';ov.classList.add('on');$('#gn').focus()}
function add(){cc=+$('#gc').value;const a=Math.round(+$('#gv').value),n=$('#gn').value.trim()||(cc==2?'Ahorro':'');if(!n||!(a>0)){$('#me').textContent='Escribe un nombre y un valor mayor a 0.';return}mo(CM());S.g.push({id:Date.now()+'',c:cc,n,a,d:td(),...(gid&&cc==2?{gid}:{})});gid=null;save();ov.classList.remove('on');render()}
function rm(id){S.g=S.g.filter(x=>x.id!=id);save();render()}
const pm=k=>{const d=new Date(+k.slice(0,4),+k.slice(5)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},
dl=day=>{const t=new Date();t.setHours(0,0,0,0);const y=t.getFullYear(),m=t.getMonth(),at=(mm)=>new Date(y,mm,Math.min(day,new Date(y,mm+1,0).getDate()));let d=at(m);if(d<t)d=at(m+1);return Math.round((d-t)/864e5)};
function ex1(r,k){const al=[];[0,1].forEach(c=>{const p=r.b[c]?r.u[c]*100/r.b[c]:0;if(p>100)al.push(['r','Te pasaste en '+CN[c]+' por '+M(r.u[c]-r.b[c])+'.']);else if(p>=80)al.push(['w','Ya usaste el '+Math.round(p)+'% de '+CN[c]+'.'])});
(S.rem||[]).forEach(x=>{const d=dl(x.d);if(d<=3)al.push([d?'w':'r',x.n+' '+M(x.a)+(d?' vence en '+d+' día'+(d>1?'s':''):' vence hoy')+'.'])});
const pk=pm(k),pg=calc(pk).gs,cmp=pg?'Gastaste un '+Math.round(Math.abs(r.gs-pg)*100/pg)+'% '+(r.gs>=pg?'más':'menos')+' que en '+MES[+pk.slice(5)-1]+'.':'';
return al.map(a=>`<div class='al ${a[0]}'>⚠ ${E(a[1])}</div>`).join('')+`<div class='card'><b>Resumen de ${lab(k)}</b><p>Ahorraste el ${Math.round(r.u[2]*100/r.s)}% de tu salario y gastaste el ${Math.round(r.gs*100/r.s)}%. ${cmp}</p></div>`}
function ex2(){const G=(S.goals||[]).map(x=>{const s=S.g.filter(y=>y.gid==x.id).reduce((a,y)=>a+y.a,0);return`<div class='it' style='display:block'><div class='trio'><span>${E(x.n)}</span><span><b>${M(s)}</b> <span class='l'>de ${M(x.a)}</span></span></div><div class='bar'><i style='width:${Math.min(100,s*100/x.a)}%;background:var(--g)'></i></div><button class='mini' onclick="og('${x.id}')">+ Abonar</button> <button class='mini' onclick="dm('goals','${x.id}')">✕</button></div>`}).join('')||'<p class="l">Crea una meta, por ejemplo: Fondo de emergencia.</p>';
const R=(S.rem||[]).slice().sort((a,b)=>dl(a.d)-dl(b.d)).map(x=>{const d=dl(x.d);return`<div class='it'><span>${E(x.n)}<small>${d?'En '+d+' día'+(d>1?'s':'')+' · día '+x.d:'Hoy'}</small></span><span><b>${M(x.a)}</b> <button class='mini' onclick="payR('${x.id}')">Pagar</button><button onclick="dm('rem','${x.id}')">✕</button></span></div>`}).join('')||'<p class="l">Agrega recordatorios como arriendo o internet.</p>';
